name: Deploy image

# Builds and pushes the internal, CSP-locked, self-hosted viewer image
# (Dockerfile) to GHCR. Tags here (v*) are this fork's own internal
# deployment versioning and distinct from upstream's release tags (which
# have no "v" prefix), so the two schemes never collide.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/team6083/viewer:${{ steps.v.outputs.version }}
            ghcr.io/team6083/viewer:latest
