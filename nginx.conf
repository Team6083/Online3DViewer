# Replaces the base nginxinc/nginx-unprivileged image's conf.d/default.conf.
# The image's own nginx.conf already sends every temp path and the pid file
# to /tmp (see Dockerfile), so no other writable paths are needed here.
server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Locked down for an internal, unauthenticated deployment: connect-src
    # 'self' means a model URL pointing off-domain (e.g. #model=https://...)
    # is fetched by the browser, not proxied by this server, and gets
    # blocked here rather than leaking a request to whatever host it names.
    # wasm-unsafe-eval is required to instantiate the STEP/IGES/BREP importer
    # (occt-import-js); it does not permit js eval(). Adjust only in
    # response to an actual CSP violation in the browser console, and never
    # loosen connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'self'" always;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
    error_page 500 502 503 504 /50x.html;
}
